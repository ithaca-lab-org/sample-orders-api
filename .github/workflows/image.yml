name: image

# Pull requests: build and scan only. Push to main: build, scan, push to GitHub Container Registry with the workflow's
# own token (no keys anywhere) and print the digest: paste it into deploy/base/deployment.yaml. The package must be
# public for the cluster to pull it anonymously (check it after the first push: Packages > sample-orders-api >
# Package settings).
on:
  pull_request:
    branches: [main]
    paths: [Dockerfile, .dockerignore, go.mod, main.go, .github/workflows/image.yml]
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, go.mod, main.go, .github/workflows/image.yml]

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ithaca-lab-org/sample-orders-api

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: sample-orders-api:ci
      - name: scan (fails on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sample-orders-api:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  push:
    if: github.event_name == 'push'
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "pushed ${IMAGE}:${GITHUB_SHA} -> ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
