# Platform contract (idp-infra ADR 0009, ADR 0011): the workload `orders` is ordered on the portal Workloads page, which
# creates ServiceAccount `orders`; the pod must run as that ServiceAccount and carry the label below (the ambient
# AuthorizationPolicy, the Vault role and the IAM principal all key on it), and Spinnaker's admission policy refuses a
# Deployment where the two differ. The image is named by DIGEST: CI prints it (job summary of the image workflow), paste it here and commit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels: {app: orders}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels:
        app: orders
        idp.ithaca-idp.com/workload: orders
    spec:
      serviceAccountName: orders
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: orders
          image: ghcr.io/ithaca-lab-org/sample-orders-api@sha256:715f2adf1597b5deb5ec40c55c9893863d9107066d05267ee4a439964e59a7ec
          ports:
            - {name: http, containerPort: 8080}
          # Keys of the portal secret `orders-config` (Secrets page): ORDERS_API_KEY and ORDERS_GREETING.
          envFrom:
            - secretRef: {name: orders-config}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
